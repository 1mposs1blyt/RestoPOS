name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

# Как и Android-сборка: только ручной запуск или метка в сообщении коммита.
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[RUN]') ||
      contains(github.event.head_commit.message, '[BUILD]')

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — приоритет: кассовые терминалы на нём. Даёт .msi (WiX) и .exe (NSIS).
          - os: windows-latest
            target_name: windows
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # Linux (22.04 ради совместимости AppImage/webkit2gtk-4.1) — то, на чём идёт
          # разработка. Даёт .deb/.rpm/AppImage; AppImage удобно гонять локально.
          - os: ubuntu-22.04
            target_name: linux
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Системные зависимости Tauri нужны только на Linux (на win/mac всё в SDK).
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri build сам вызовет beforeBuildCommand (pnpm build → vite build фронтенда),
      # затем соберёт нативный бандл под текущую ОС в target/release/bundle.
      - name: Build desktop app
        run: pnpm --filter @restopos/desktop tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: restopos-desktop-${{ matrix.target_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
