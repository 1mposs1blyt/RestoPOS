[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` включает инспектор WebView2 и в релизной сборке. Дев-панель
# переключения терминала вырезается из прода вместе с `import.meta.env.DEV`,
# и без инспектора режим кассы в собранном .exe сменить нечем: он читается
# из localStorage при старте (`src/app/session.tsx`).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
