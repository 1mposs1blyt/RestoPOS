# Инструкции для Claude Code (Монорепо RestoPOS)

## Команды сборки и проверок
- **Установка:** `pnpm install` (строго `pnpm`, игнорируй `package-lock.json`).
- **Линтер и фронт-тесты:** `pnpm verify` (включает проверку контрактов, Biome, TSC, Vitest и Vite-билд).
- **Тестирование Rust (КРИТИЧНО):** `cd apps/desktop/src-tauri && cargo test --lib` (обязательно при любых правках фискального слоя или команд Tauri). `pnpm verify` Rust не проверяет!
- **Проверка Rust-релиза:** `cd apps/desktop/src-tauri && cargo check --release`.
- **Генерация контрактов:** `pnpm contracts:build` (после правок в `contracts/contract.json`).

## Строгие запреты (Красные флаги)
1. **НЕ ПРАВИТЬ УЗЕЛ (`apps/backend/server/**`)**: Код на C# — чужая зона (только чтение). Не исправляй там баги, не добавляй эндпоинты. Если нужен эндпоинт, а его нет — фронт работает на локальном стейте, заглушки (mocks) в узле не писать.
2. **НЕ ТРОГАТЬ СГЕНЕРИРОВАННОЕ**: Файлы `contract.generated.ts` и `Contract.generated.cs` руками не менять. Правится только исходник `contracts/contract.json`.
3. **БЕЗ `npm`**: Менеджер пакетов — только pnpm. Любые изменения в `package-lock.json` в диффе — это ошибка, их нужно откатить.
4. **БЕЗ МАСШТАБИРОВАНИЯ В ЗАЛЕ**: В `screens/tablescheme.tsx` координаты столов (`cx`/`cy`) хранятся в долях холста 0..1, размеры — в пикселях. Не пытайся вписать это в логическое разрешение экрана.

## Правила архитектуры и бизнес-логики
- **Порядок оплаты:** Строгий и нерушимый порядок в `state/checkout.tsx`: `эквайринг → фискальный чек → заказ оплачен`. При сбоях на эквайринге — отмена (reversal). При сбоях фискального регистратора — `needsAttention` (ни повторять, ни закрывать заказ без участия человека).
- **Денежная логика:** Деньги считаем в целых копейках (`lib/money.ts`, `Kopecks` в Rust). Цена в заказе (`OrderItem.price`) — это исторический снимок, запрещено тянуть цену блюда напрямую из меню при пересчете итога чека.
- **Вёрстка (Сенсорные экраны):** Минимальная высота цели касания — `min-h-11` (44px), для частых действий `min-h-14`. Отрисовка нажатия через `active:`, так как `hover` на терминалах не работает. Перетаскивание делать через Pointer Events.
- **Доступ (UX vs Защита):** Матрица ролей проверяется через `packages/shared-types/src/access.ts`. Вход техподдержки (`terminal.service`) в узел не ходит вообще, проверяется по `SERVICE_PIN`.

## Инструкции для автономного цикла (Loop)
1. Если сборка падает с ошибкой блокировки файла (`EBUSY`, `os error 5` в Windows), выполни команду остановки запущенных процессов `Get-Process desktop | Stop-Process -Force` перед повторной сборкой.
2. Все коммиты, документацию и комментарии к коду пиши строго на русском языке.
3. Перед завершением задачи прогоняй `pnpm verify`, а при работе с `src-tauri` — `cargo test --lib`.